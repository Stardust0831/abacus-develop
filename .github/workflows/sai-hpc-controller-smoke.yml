name: SAI HPC controller smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "LibDDLA commit to run"
        required: true
        default: "a27160001978cd9a4172d755a86ac2b004e68eba"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: gpu-ci-manual
    timeout-minutes: 60
    env:
      REMOTE_ROOT: ~/sai-hpc-controller-smoke
      REMOTE_HOST: c0.sai.ai-4s.com
      REMOTE_PORT: "12022"
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONTROLLER_REF: 6427df80be2e80572925e4e1de8ff808fcb0a62a
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AI4SAI/sai-hpc-ci
          ref: ${{ env.CONTROLLER_REF }}
          path: sai-hpc-ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Stardust0831/LibDDLA
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Stardust0831/abacus-develop
          ref: develop
          path: site-config
          sparse-checkout: .ci/slurm/config.ini
          persist-credentials: false
      - name: Validate smoke plan
        run: |
          set -euo pipefail
          cat > plan.json <<EOF
          {"version":1,"cluster_profile":"sai-cuda12-openmpi5","source":{"repository":"Stardust0831/LibDDLA","sha":"$SOURCE_SHA"},"tests":[{"name":"container-smoke","nodes":1,"gpus_per_node":1,"ranks_per_node":1,"timeout_minutes":20,"working_directory":".","command":["sh","-c","test -f CMakeLists.txt && hostname && printf container-ok\\n"]}]}
          EOF
          python3 sai-hpc-ci/controller/validate_plan.py plan.json --output validated.json \
            --expected-repository Stardust0831/LibDDLA --expected-sha "$SOURCE_SHA" \
            --expected-profile sai-cuda12-openmpi5
      - name: Configure SSH
        env:
          REMOTE_SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remote-ssh"
          mkdir -m 700 "$root"
          printf '%s\n' "$REMOTE_SSH_PRIVATE_KEY" > "$root/id_ed25519"
          chmod 600 "$root/id_ed25519"
          REMOTE_USER=$(awk -F ' *= *' '$1 == "user" {print $2; exit}' site-config/.ci/slurm/config.ini)
          test -n "$REMOTE_USER"
          export REMOTE_USER
          printf '%s\n' '[c0.sai.ai-4s.com]:12022 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBurYQExmMdgat4VU1Twmu2pqxsBjLP6eff9oc6/8N3KUCtoe8HU9eONghETLECdA7A+O9DpefDRba0AcSXTfQc=' > "$root/known_hosts"
          cat > "$root/config" <<EOF
          Host gpu-ci
              HostName $REMOTE_HOST
              Port $REMOTE_PORT
              User $REMOTE_USER
              IdentityFile $root/id_ed25519
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              UserKnownHostsFile $root/known_hosts
          EOF
          chmod 600 "$root/config"
          echo "REMOTE_SSH_CONFIG=$root/config" >> "$GITHUB_ENV"
          remote_suffix="${REMOTE_ROOT#~/}"
          REMOTE_ROOT=$(ssh -F "$root/config" gpu-ci "printf '%s/%s' \"\$HOME\" '$remote_suffix'")
          echo "REMOTE_ROOT=$REMOTE_ROOT" >> "$GITHUB_ENV"
      - name: Submit controller smoke job
        run: |
          set -euo pipefail
          run_root="$REMOTE_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          ssh -F "$REMOTE_SSH_CONFIG" gpu-ci "mkdir -p '$run_root/bundle'"
          cp validated.json "$RUNNER_TEMP/validated.json"
          cp sai-hpc-ci/remote/run_array_task.py sai-hpc-ci/remote/task.sbatch \
             sai-hpc-ci/remote/submit_array.sh sai-hpc-ci/remote/wait_jobs.sh "$RUNNER_TEMP/"
          cp sai-hpc-ci/profiles/sai-cuda12-openmpi5.env "$RUNNER_TEMP/profile.env"
          scp -F "$REMOTE_SSH_CONFIG" "$RUNNER_TEMP/validated.json" \
            "$RUNNER_TEMP/run_array_task.py" "$RUNNER_TEMP/task.sbatch" \
            "$RUNNER_TEMP/submit_array.sh" "$RUNNER_TEMP/wait_jobs.sh" \
            "$RUNNER_TEMP/profile.env" "gpu-ci:$run_root/bundle/"
          jobs=$(ssh -F "$REMOTE_SSH_CONFIG" gpu-ci \
            "cd '$run_root/bundle' && PROFILE_FILE=profile.env PLAN_FILE=validated.json REMOTE_ROOT='$run_root' CONTROLLER_ROOT='$run_root/bundle' SLURM_SCRIPT=task.sbatch bash submit_array.sh" \
            | grep -E '^[0-9]+(_[0-9]+)?$')
          ssh -F "$REMOTE_SSH_CONFIG" gpu-ci "bash '$run_root/bundle/wait_jobs.sh' $jobs"
          mkdir -p "$RUNNER_TEMP/results"
          scp -r -F "$REMOTE_SSH_CONFIG" "gpu-ci:$run_root/results/." "$RUNNER_TEMP/results/"
      - name: Download results after failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          scp -r -F "$REMOTE_SSH_CONFIG" "gpu-ci:$RUN_ROOT/results/." "$RUNNER_TEMP/results/" || true
          scp -r -F "$REMOTE_SSH_CONFIG" "gpu-ci:$RUN_ROOT/bundle/." "$RUNNER_TEMP/results/bundle/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sai-hpc-controller-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
