name: SAI RT-TDDFT Scaling Benchmark

on:
  workflow_dispatch:
    inputs:
      install_run:
        description: "Successful SAI CI run, relative to the project root"
        required: true
        type: string
      abacus_sha256:
        description: "Expected SHA-256 of install/bin/abacus"
        required: true
        type: string
      run_kind:
        description: "Trial launch validation or the seven-case formal benchmark"
        required: true
        default: trial
        type: choice
        options:
          - trial
          - formal
      project_root:
        description: "Optional absolute project root below the SAI account HOME"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sai-rt-tddft-efficiency-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment:
      name: sai-ssh-manual
    env:
      PROJECT_ROOT_INPUT: ${{ inputs.project_root }}
      INSTALL_RUN_INPUT: ${{ inputs.install_run }}
      ABACUS_SHA256_INPUT: ${{ inputs.abacus_sha256 }}
      RUN_KIND_INPUT: ${{ inputs.run_kind }}
      SAI_PROJECT_ROOT_DEFAULT: ${{ vars.SAI_PROJECT_ROOT }}
      SAI_SSH_HOST: ${{ vars.SAI_SSH_HOST }}
      SAI_SSH_PORT: ${{ vars.SAI_SSH_PORT }}
      SAI_SSH_USER: ${{ vars.SAI_SSH_USER }}
      SAI_SSH_CONFIG: ""
      REMOTE_RUN_ROOT: ""
      ARTIFACT_ROOT: ""
      SUBMISSION_STARTED: ""
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate benchmark inputs
        run: |
          set -euo pipefail
          project_root=${PROJECT_ROOT_INPUT:-$SAI_PROJECT_ROOT_DEFAULT}
          : "${project_root:?Set SAI_PROJECT_ROOT or the workflow input}"
          expected_home_prefix="/home/abacus-group/$SAI_SSH_USER/"
          expected_org_prefix="/org/abacus-group/$SAI_SSH_USER/"
          [[ "$project_root/" == "$expected_home_prefix"* \
            || "$project_root/" == "$expected_org_prefix"* ]]
          [[ "$project_root" =~ ^/[A-Za-z0-9._/-]+$ ]]
          case "/$project_root/" in */./*|*/../*) exit 2 ;; esac
          [[ "$INSTALL_RUN_INPUT" =~ ^runs/[A-Za-z0-9._/-]+$ ]]
          case "/$INSTALL_RUN_INPUT/" in */./*|*/../*) exit 2 ;; esac
          [[ "$ABACUS_SHA256_INPUT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RUN_KIND_INPUT" == trial || "$RUN_KIND_INPUT" == formal ]]
          {
            echo "SAI_PROJECT_ROOT=$project_root"
            echo "INSTALL_RUN=$INSTALL_RUN_INPUT"
            echo "ABACUS_SHA256=$ABACUS_SHA256_INPUT"
            echo "RUN_KIND=$RUN_KIND_INPUT"
          } >> "$GITHUB_ENV"

      - name: Configure pinned SSH client
        env:
          SAI_SSH_PRIVATE_KEY: ${{ secrets.SAI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash ci/sai/configure_ssh_client.sh \
            "$RUNNER_TEMP/sai-ssh" "$GITHUB_WORKSPACE/ci/sai/known_hosts"
          echo "SAI_SSH_CONFIG=$RUNNER_TEMP/sai-ssh/config" >> "$GITHUB_ENV"

      - name: Prepare isolated benchmark
        run: |
          set -euo pipefail
          connected=0
          for attempt in {1..4}; do
            if ssh -F "$SAI_SSH_CONFIG" -o ConnectionAttempts=1 -MNf sai-ci; then
              connected=1
              break
            fi
            [[ $attempt -eq 4 ]] || sleep $((attempt * 5))
          done
          [[ $connected -eq 1 ]]
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output=$(ssh -F "$SAI_SSH_CONFIG" sai-ci bash -s -- \
            prepare "$SAI_PROJECT_ROOT" "$INSTALL_RUN" "$run_key" "$RUN_KIND" \
            "$ABACUS_SHA256" < ci/sai/rt_tddft_efficiency_remote.sh)
          printf '%s\n' "$output"
          run_root=$(awk -F= '$1 == "RUN_ROOT" {print $2}' <<< "$output")
          [[ "$run_root" == "$SAI_PROJECT_ROOT/benchmarks/rt-tddft-efficiency/$run_key" ]]
          echo "REMOTE_RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          rsync -az --timeout=600 -e "ssh -F $SAI_SSH_CONFIG" \
            ci/sai/rt_tddft_efficiency_remote.sh ci/sai/rt_tddft_scale.sbatch \
            ci/sai/summarize_rt_tddft_efficiency.sh \
            "sai-ci:$run_root/control/"

      - name: Validate all Slurm submissions
        run: |
          set -euo pipefail
          ssh -F "$SAI_SSH_CONFIG" sai-ci bash \
            "$REMOTE_RUN_ROOT/control/rt_tddft_efficiency_remote.sh" \
            preflight "$REMOTE_RUN_ROOT"

      - name: Submit benchmark jobs
        run: |
          set -euo pipefail
          echo "SUBMISSION_STARTED=1" >> "$GITHUB_ENV"
          ssh -F "$SAI_SSH_CONFIG" sai-ci bash \
            "$REMOTE_RUN_ROOT/control/rt_tddft_efficiency_remote.sh" \
            submit "$REMOTE_RUN_ROOT"

      - name: Wait for benchmark jobs
        if: always() && env.SUBMISSION_STARTED == '1'
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            set +e
            output=$(ssh -F "$SAI_SSH_CONFIG" -o ControlMaster=no \
              -o ConnectionAttempts=4 sai-ci bash \
              "$REMOTE_RUN_ROOT/control/rt_tddft_efficiency_remote.sh" \
              status "$REMOTE_RUN_ROOT" 2>&1)
            query_rc=$?
            set -e
            printf '%s\n' "$output"
            if [[ $query_rc -eq 0 ]]; then
              active=$(awk -F= '$1 == "ACTIVE_TASKS" {print $2}' <<< "$output")
              [[ "$active" =~ ^[0-9]+$ ]]
              [[ "$active" -eq 0 ]] && exit 0
            else
              echo "SAI benchmark status query failed (attempt $attempt/120, rc=$query_rc)" >&2
            fi
            sleep 60
          done
          echo "Timed out waiting for benchmark jobs" >&2
          exit 1

      - name: Summarize benchmark
        if: always() && env.REMOTE_RUN_ROOT != ''
        run: |
          set -euo pipefail
          for attempt in {1..4}; do
            if ssh -F "$SAI_SSH_CONFIG" -o ControlMaster=no \
              -o ConnectionAttempts=4 sai-ci bash \
              "$REMOTE_RUN_ROOT/control/rt_tddft_efficiency_remote.sh" \
              summarize "$REMOTE_RUN_ROOT"; then
              exit 0
            fi
            [[ $attempt -eq 4 ]] || sleep $((attempt * 10))
          done
          exit 1

      - name: Collect compact benchmark artifacts
        if: always() && env.REMOTE_RUN_ROOT != ''
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/efficiency-artifacts"
          archive="$RUNNER_TEMP/efficiency-artifacts.tar.gz"
          mkdir -p "$artifact_root"
          collected=0
          for attempt in {1..4}; do
            rm -f "$archive"
            if ssh -F "$SAI_SSH_CONFIG" -o ControlMaster=no \
              -o ConnectionAttempts=4 sai-ci bash \
              "$REMOTE_RUN_ROOT/control/rt_tddft_efficiency_remote.sh" \
              collect "$REMOTE_RUN_ROOT" > "$archive" && tar -tzf "$archive" >/dev/null; then
              collected=1
              break
            fi
            [[ $attempt -eq 4 ]] || sleep $((attempt * 10))
          done
          [[ $collected -eq 1 ]]
          tar -xzf "$archive" -C "$artifact_root"
          echo "ARTIFACT_ROOT=$artifact_root" >> "$GITHUB_ENV"
          if [[ -f "$artifact_root/results/summary.md" ]]; then
            cat "$artifact_root/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove local SSH credentials
        if: always()
        run: |
          if [[ -f ${SAI_SSH_CONFIG:-} ]]; then
            ssh -F "$SAI_SSH_CONFIG" -O exit sai-ci 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/sai-ssh"

      - name: Upload benchmark artifacts
        if: always() && env.ARTIFACT_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sai-rt-tddft-efficiency-${{ inputs.run_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 30
