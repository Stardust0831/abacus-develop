name: SAI GPU Case Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

concurrency:
  group: sai-gpu-rebuild
  cancel-in-progress: false

jobs:
  rebuild-and-test:
    name: SAI official NVIDIA stack rebuild and GPU validation
    runs-on: [self-hosted, linux, x64, sai-slurm, v100, cusolvermp]
    timeout-minutes: 210
    environment: sai-gpu
    env:
      MP_PROFILE: archive-mp09-sai-nccl2293
      SAI_PROJECT_ROOT_CONFIG: ${{ vars.SAI_PROJECT_ROOT }}
      RUN_ROOT: ${{ github.workspace }}/.sai-run-uninitialized
      BUILD_ROOT: ${{ github.workspace }}/.sai-run-uninitialized/build
      INSTALL_ROOT: ${{ github.workspace }}/.sai-run-uninitialized/install
      RESULT_ROOT: ${{ github.workspace }}/.sai-run-uninitialized/results
      SAI_DISABLE_NCCL_IB: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create isolated SAI run directory
        run: |
          set -euo pipefail
          if [[ -n "$SAI_PROJECT_ROOT_CONFIG" ]]; then
            export SAI_PROJECT_ROOT=$SAI_PROJECT_ROOT_CONFIG
          fi
          : "${SAI_PROJECT_ROOT:?Set SAI_PROJECT_ROOT in the runner environment or repository variable}"
          [[ "$SAI_PROJECT_ROOT" != *$'\n'* ]]
          CANONICAL_HOME=$(cd "$HOME" && pwd -P)
          SAI_PROJECT_ROOT=$(realpath --canonicalize-missing "$SAI_PROJECT_ROOT")
          case "$SAI_PROJECT_ROOT" in
            "$CANONICAL_HOME"/*) ;;
            *)
              echo "SAI_PROJECT_ROOT must resolve below HOME: $CANONICAL_HOME" >&2
              exit 1
              ;;
          esac
          mkdir -p "$SAI_PROJECT_ROOT"
          SAI_PROJECT_ROOT=$(cd "$SAI_PROJECT_ROOT" && pwd -P)
          [[ "$SAI_PROJECT_ROOT" == "$CANONICAL_HOME/"* ]]
          RUN_ROOT=$SAI_PROJECT_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          CI_SOURCE=$RUN_ROOT/source
          BUILD_ROOT=$RUN_ROOT/build
          INSTALL_ROOT=$RUN_ROOT/install
          RESULT_ROOT=$RUN_ROOT/results

          [[ ! -e "$RUN_ROOT" ]] || {
            echo "Refusing to reuse an existing run directory: $RUN_ROOT" >&2
            exit 1
          }
          mkdir -p "$CI_SOURCE" "$BUILD_ROOT" "$INSTALL_ROOT" "$RESULT_ROOT"
          rsync -a --exclude .git/ "$GITHUB_WORKSPACE/" "$CI_SOURCE/"
          TOOLCHAIN_FILE=$CI_SOURCE/ci/sai/toolchains/archive-mp09-sai-nccl2293.env.example

          {
            echo "SAI_PROJECT_ROOT=$SAI_PROJECT_ROOT"
            echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE"
            echo "RUN_ROOT=$RUN_ROOT"
            echo "CI_SOURCE=$CI_SOURCE"
            echo "BUILD_ROOT=$BUILD_ROOT"
            echo "INSTALL_ROOT=$INSTALL_ROOT"
            echo "RESULT_ROOT=$RESULT_ROOT"
          } >> "$GITHUB_ENV"

      - name: Prepare official NVIDIA MP archives
        run: |
          set -euo pipefail
          export SAI_NVIDIA_MP_ROOT=$RUN_ROOT/vendor/nvidia-mp-0.9-archive
          bash ci/sai/prepare_nvidia_mp.sh

      - name: Build current checkout on Slurm
        run: |
          set -euo pipefail
          log="$RESULT_ROOT/sai-build-submit.log"
          export CI_SOURCE BUILD_ROOT INSTALL_ROOT RESULT_ROOT TOOLCHAIN_FILE
          "$CI_SOURCE/ci/sai/run_slurm_job.sh" "$log" \
            "$RESULT_ROOT/sai-build-%j.out" \
            "$CI_SOURCE/ci/sai/build_gpu.sbatch"

      - name: Submit concurrent per-case and multinode GPU validations
        run: |
          set -euo pipefail
          export CI_SOURCE INSTALL_ROOT RESULT_ROOT TOOLCHAIN_FILE MP_PROFILE
          "$CI_SOURCE/ci/sai/run_gpu_validation.sh"

      - name: Upload SAI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sai-official-gpu-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BUILD_ROOT }}/toolchain-summary.txt
            ${{ env.BUILD_ROOT }}/CMakeCache.txt
            ${{ env.INSTALL_ROOT }}/abacus-info.txt
            ${{ env.INSTALL_ROOT }}/ldd.txt
            ${{ env.INSTALL_ROOT }}/abacus.sha256
            ${{ env.RESULT_ROOT }}/case-matrix/inventory.txt
            ${{ env.RESULT_ROOT }}/case-matrix/array-jobs.tsv
            ${{ env.RESULT_ROOT }}/case-matrix/array-sacct.txt
            ${{ env.RESULT_ROOT }}/case-matrix/array-task-accounting.tsv
            ${{ env.RESULT_ROOT }}/case-matrix/arrays-terminal.txt
            ${{ env.RESULT_ROOT }}/case-matrix/gpu-case-summary.md
            ${{ env.RESULT_ROOT }}/case-matrix/manifests/*.tsv
            ${{ env.RESULT_ROOT }}/case-matrix/logs/*.out
            ${{ env.RESULT_ROOT }}/case-matrix/status/*.tsv
            ${{ env.RESULT_ROOT }}/case-matrix/tasks/*/case.log
            ${{ env.RESULT_ROOT }}/case-matrix/tasks/*/work/tests/*/*/log.txt
            ${{ env.RESULT_ROOT }}/case-matrix/tasks/*/work/tests/*/*/result.out
            ${{ env.RESULT_ROOT }}/case-matrix/tasks/*/work/tests/*/*/OUT.*/running*.log
            ${{ env.RESULT_ROOT }}/case-matrix/tasks/*/work/tests/*/*/OUT.*/warning.log
            ${{ env.RESULT_ROOT }}/gpu-validation-components.tsv
            ${{ env.CI_SOURCE }}/tests/**/log.txt
            ${{ env.CI_SOURCE }}/tests/**/result.out
            ${{ env.RESULT_ROOT }}/*.log
            ${{ env.RESULT_ROOT }}/*.out
            ${{ env.RESULT_ROOT }}/*.txt
          if-no-files-found: warn
