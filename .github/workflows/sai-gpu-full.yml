name: SAI GPU Full Validation

# GitHub can dispatch only workflow paths registered on the default branch.
# This experiment branch reuses that registered path to call its local legacy
# workflow at the same commit. The inputs stay compatible with the registered
# dispatcher but do not alter the legacy experiment.
on:
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Compatibility input; ignored by the legacy control"
        required: true
        default: false
        type: boolean
      slurm_nodelist:
        description: "Compatibility input; ignored by the legacy control"
        required: false
        default: ""
        type: string
      disable_nccl_ib_for_cusolvermp:
        description: "Compatibility input; ignored because cuSolverMp 0.5 uses CAL"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  nvhpc245-legacy-control:
    uses: ./.github/workflows/sai-gpu-nvhpc245.yml
