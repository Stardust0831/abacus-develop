name: SAI GPU Case Matrix

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Approved code SHA; executes as the configured SAI account"
        required: true
        type: string
      project_root:
        description: "Optional absolute project root below the SAI account HOME"
        required: false
        default: ""
        type: string
      run_namespace:
        description: "Optional run subdirectory, for example pr-7658"
        required: false
        default: "manual"
        type: string
  schedule:
    - cron: "30 20 * * *"

permissions: {}

concurrency:
  group: sai-gpu-${{ github.event_name == 'schedule' && 'daily' || github.run_id }}
  cancel-in-progress: false

jobs:
  admit:
    name: Authorize SAI GPU request
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/abacus-ci sai-gpu')
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      check_run_id: ${{ steps.request.outputs.check_run_id }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_namespace: ${{ steps.request.outputs.run_namespace }}
      source_repository: ${{ steps.request.outputs.source_repository }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - name: Checkout trusted request handler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Resolve and authorize request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_NAMESPACE: ${{ inputs.run_namespace || 'manual' }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: python3 control/ci/sai/sai.py github authorize

  rebuild-and-test:
    name: SAI SSH rebuild and GPU validation
    needs: admit
    if: needs.admit.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_url: ${{ steps.artifact_upload.outputs.artifact-url }}
      case_summary_available: ${{ steps.case_summary.outputs.available }}
      gpu_failed: ${{ steps.case_summary.outputs.failed }}
      gpu_infrastructure: ${{ steps.case_summary.outputs.infrastructure }}
      gpu_passed: ${{ steps.case_summary.outputs.passed }}
      gpu_total: ${{ steps.case_summary.outputs.total }}
      components: ${{ steps.case_summary.outputs.components }}
    permissions:
      actions: read
      checks: write
      contents: read
    environment:
      name: ${{ github.event_name == 'schedule' && 'sai-ssh-scheduled' || 'sai-ssh-manual' }}
    env:
      CHECK_RUN_ID: ${{ needs.admit.outputs.check_run_id }}
      SOURCE_REPOSITORY: ${{ needs.admit.outputs.source_repository }}
      SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
      PROJECT_ROOT_INPUT: ${{ inputs.project_root || '' }}
      RUN_NAMESPACE_INPUT: ${{ needs.admit.outputs.run_namespace }}
      SAI_PROJECT_ROOT_DEFAULT: ${{ vars.SAI_PROJECT_ROOT }}
      SAI_SSH_HOST: ${{ vars.SAI_SSH_HOST }}
      SAI_SSH_PORT: ${{ vars.SAI_SSH_PORT }}
      SAI_SSH_USER: ${{ vars.SAI_SSH_USER }}
      ARTIFACT_ROOT: ""
      SAI_SSH_CONFIG: ""
    steps:
      - name: Checkout trusted CI control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Validate requested source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          requested_root=${PROJECT_ROOT_INPUT:-$SAI_PROJECT_ROOT_DEFAULT}
          : "${requested_root:?Set the SAI_PROJECT_ROOT Environment variable or workflow input}"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            run_namespace=daily
            source_cache_role=baseline
          else
            run_namespace=${RUN_NAMESPACE_INPUT:-manual}
            source_cache_role=candidate
          fi
          [[ "$run_namespace" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          {
            echo "REQUESTED_PROJECT_ROOT=$requested_root"
            echo "RUN_NAMESPACE=$run_namespace"
            echo "SOURCE_CACHE_ROLE=$source_cache_role"
          } >> "$GITHUB_ENV"

      - name: Checkout requested ABACUS commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Mark requested PR check in progress
        if: env.CHECK_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/ci/sai/sai.py github start-check

      - name: Verify immutable source checkout
        run: |
          set -euo pipefail
          actual_sha=$(git -C source rev-parse HEAD)
          [[ "$actual_sha" == "$SOURCE_SHA" ]]
          control_sha=$(git -C control rev-parse HEAD)
          git -C source diff --exit-code
          git -C source diff --cached --exit-code
          git -C control diff --exit-code
          git -C control diff --cached --exit-code
          echo "SOURCE_SHA=$actual_sha"
          echo "CONTROL_SHA=$control_sha" >> "$GITHUB_ENV"

      - name: Configure pinned SSH client
        env:
          SAI_SSH_PRIVATE_KEY: ${{ secrets.SAI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 control/ci/sai/sai.py github configure-ssh \
            "$RUNNER_TEMP/sai-ssh" "$GITHUB_WORKSPACE/control/ci/sai/known_hosts"
          echo "SAI_SSH_CONFIG=$RUNNER_TEMP/sai-ssh/config" >> "$GITHUB_ENV"

      - name: Run the shared SAI client
        id: sai_client
        continue-on-error: true
        run: |
          set -euo pipefail
          artifact_parent="$RUNNER_TEMP/sai-artifacts"
          artifact_root="$artifact_parent/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          client_config="$RUNNER_TEMP/sai-client.ini"
          mkdir -p "$artifact_parent"
          printf '%s\n' \
            '[local]' \
            "ssh_config = $SAI_SSH_CONFIG" \
            'ssh_target = sai-ci' \
            "project_root = $REQUESTED_PROJECT_ROOT" \
            "run_namespace = $RUN_NAMESPACE" \
            "artifact_root = $artifact_parent" > "$client_config"
          echo "ARTIFACT_ROOT=$artifact_root" >> "$GITHUB_ENV"
          set +e
          python3 control/ci/sai/sai.py local run \
            --config "$client_config" \
            --source-repository "$GITHUB_WORKSPACE/source" \
            --source-ref "$SOURCE_SHA" \
            --cache-role "$SOURCE_CACHE_ROLE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --defer-archive \
            2>&1 | tee "$RUNNER_TEMP/sai-client.log"
          client_rc=${PIPESTATUS[0]}
          set -e
          mkdir -p "$ARTIFACT_ROOT"
          cp "$RUNNER_TEMP/sai-client.log" "$ARTIFACT_ROOT/"
          echo "exit_code=$client_rc" >> "$GITHUB_OUTPUT"
          exit "$client_rc"

      - name: Publish GPU case summary
        id: case_summary
        if: always()
        run: |
          set -euo pipefail
          result=${ARTIFACT_ROOT:+$ARTIFACT_ROOT/results/case-matrix/result.json}
          python3 control/ci/sai/sai.py report github \
            --result "${result:-$RUNNER_TEMP/missing-result.json}" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload SAI logs
        id: artifact_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sai-ssh-gpu-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Archive uploaded SAI run
        if: >-
          always() && steps.case_summary.outputs.available == 'true' &&
          steps.artifact_upload.outcome == 'success'
        run: |
          set -euo pipefail
          context="$ARTIFACT_ROOT/local-run-context.txt"
          [[ -f "$context" ]]
          remote_run_root=$(awk -F= '$1 == "remote_run_root" {print $2}' "$context")
          [[ -n "$remote_run_root" ]]
          ssh -F "$SAI_SSH_CONFIG" sai-ci \
            python3 "$remote_run_root/control/sai.py" remote archive \
            "$remote_run_root"

      - name: Remove local SSH credentials
        if: always()
        run: |
          if [[ -f ${SAI_SSH_CONFIG:-} ]]; then
            ssh -F "$SAI_SSH_CONFIG" -O exit sai-ci 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/sai-ssh"

      - name: Report validation result
        if: always()
        env:
          CLIENT_OUTCOME: ${{ steps.sai_client.outcome }}
          CLIENT_EXIT_CODE: ${{ steps.sai_client.outputs.exit_code }}
          RESULT_AVAILABLE: ${{ steps.case_summary.outputs.available }}
          RESULT_PASSED: ${{ steps.case_summary.outputs.passed }}
          RESULT_FAILED: ${{ steps.case_summary.outputs.failed }}
          RESULT_INFRASTRUCTURE: ${{ steps.case_summary.outputs.infrastructure }}
          RESULT_TOTAL: ${{ steps.case_summary.outputs.total }}
        run: |
          set -euo pipefail
          echo "SAI client: $CLIENT_OUTCOME (rc=${CLIENT_EXIT_CODE:-missing})"
          [[ "$CLIENT_OUTCOME" == success || "$CLIENT_OUTCOME" == failure ]]
          [[ "$RESULT_AVAILABLE" == true ]]
          [[ "$RESULT_TOTAL" =~ ^[1-9][0-9]*$ ]]
          (( RESULT_PASSED + RESULT_FAILED + RESULT_INFRASTRUCTURE == RESULT_TOTAL ))

  component-status:
    name: SAI / ${{ matrix.component.label }}
    needs: rebuild-and-test
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.rebuild-and-test.outputs.components || '[{"name":"infrastructure","label":"Infrastructure","state":"INFRA"}]') }}
    steps:
      - name: Report component state
        env:
          COMPONENT_STATE: ${{ matrix.component.state }}
        run: |
          set -euo pipefail
          echo "Component state: $COMPONENT_STATE"
          [[ "$COMPONENT_STATE" == PASS ]]

  report-pr-check:
    name: Report SAI result to pull request
    needs: [admit, rebuild-and-test, component-status]
    if: always() && needs.admit.outputs.check_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted result reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false

      - name: Complete requested PR check
        env:
          ARTIFACT_URL: ${{ needs.rebuild-and-test.outputs.artifact_url }}
          CASE_SUMMARY_AVAILABLE: ${{ needs.rebuild-and-test.outputs.case_summary_available }}
          CHECK_RUN_ID: ${{ needs.admit.outputs.check_run_id }}
          GPU_FAILED: ${{ needs.rebuild-and-test.outputs.gpu_failed }}
          GPU_INFRASTRUCTURE: ${{ needs.rebuild-and-test.outputs.gpu_infrastructure }}
          GPU_PASSED: ${{ needs.rebuild-and-test.outputs.gpu_passed }}
          GPU_TOTAL: ${{ needs.rebuild-and-test.outputs.gpu_total }}
          PR_NUMBER: ${{ needs.admit.outputs.pr_number }}
          SAI_RESULT: ${{ needs.component-status.result }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 control/ci/sai/sai.py github complete-check
